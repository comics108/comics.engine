<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Comics Viewer Demo</title>
  <link rel="stylesheet" href="src/comics-viewer.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
    }

    .demo-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .demo-controls button {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 12px;
      margin: 2px;
      border-radius: 4px;
      cursor: pointer;
    }

    .demo-controls button:hover {
      background: #555;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div id="viewer" class="comics-viewer"></div>

  <div class="demo-controls">
    <div>
      <button onclick="toggleSound()">Toggle Sound</button>
      <button onclick="setLanguage(0)">Lang 0</button>
      <button onclick="setLanguage(1)">Lang 1</button>
    </div>
    <div id="scroll-info" style="margin-top: 8px;">Scroll: 0</div>
  </div>

  <script type="module">
    import { ComicsViewer } from './src/comics-viewer.js';

    let viewer = null;
    let soundEnabled = true;

    async function init() {
      const container = document.getElementById('viewer');
      const loading = document.getElementById('loading');
      const scrollInfo = document.getElementById('scroll-info');

      viewer = new ComicsViewer(container, {
        languageIndex: 0,
        soundEnabled: true,
        onLoad: (info) => {
          console.log('Comics loaded:', info);
          loading.classList.add('hidden');
        },
        onScroll: (offset, maxOffset) => {
          scrollInfo.textContent = `Scroll: ${Math.round(offset)} / ${Math.round(maxOffset)}`;
        },
        onError: (error) => {
          console.error('Error:', error);
          loading.innerHTML = `<div style="color: red;">Error: ${error}</div>`;
        }
      });

      // Load sample comics archive
      // Replace with actual .comics file path
      const archiveUrl = './samples/test-comics.comics';

      try {
        await viewer.load(archiveUrl);
      } catch (e) {
        console.error('Failed to load:', e);
        loading.innerHTML = `<div style="color: #666;">
          Place a .comics file at:<br>
          ${archiveUrl}
        </div>`;
      }
    }

    window.toggleSound = () => {
      soundEnabled = !soundEnabled;
      viewer?.setSoundEnabled(soundEnabled);
    };

    window.setLanguage = (index) => {
      viewer?.setLanguageIndex(index);
    };

    init();
  </script>
</body>
</html>
